name: TAGCHAOS OS Universal Slim ISO Builder

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodları Çek
        uses: actions/checkout@v4

      - name: Sistem Araçlarını Kur
        run: |
          sudo apt-get update
          sudo apt-get install -y xorriso wget curl parted grub-pc-bin grub-common cpio gzip mtools util-linux

      - name: Rootfs, Kernel ve Payload Hazırlığı
        run: |
          set -e
          mkdir -p build-root/rootfs build-root/iso/boot/grub dist
          
          ALPINE_VER="3.20.3"
          echo "[*] Alpine minirootfs indiriliyor..."
          wget -q "https://dl-cdn.alpinelinux.org/alpine/v3.20/releases/x86_64/alpine-minirootfs-${ALPINE_VER}-x86_64.tar.gz" -O alpine.tar.gz
          tar -xzf alpine.tar.gz -C build-root/rootfs
          rm alpine.tar.gz

          sudo cp /etc/resolv.conf build-root/rootfs/etc/resolv.conf
          sudo bash -c 'cat << 'EOF' > build-root/rootfs/etc/apk/repositories
          https://dl-cdn.alpinelinux.org/alpine/v3.20/main
          https://dl-cdn.alpinelinux.org/alpine/v3.20/community
          EOF'

          # Donanım sürücüleri, LTS kernel ve mkinitfs mühürle
          sudo mount --bind /proc build-root/rootfs/proc
          sudo mount --bind /sys build-root/rootfs/sys
          sudo mount --bind /dev build-root/rootfs/dev
          sudo chroot build-root/rootfs apk update
          sudo chroot build-root/rootfs apk add linux-lts mkinitfs util-linux e2fsprogs grub grub-bios eudev e2fsprogs-extra

          # Kernel sürümünü bul ve initramfs üret (<15MB)
          LTS_VER=$(ls build-root/rootfs/lib/modules | tail -n 1)
          sudo chroot build-root/rootfs mkinitfs -o /boot/initramfs-lts "$LTS_VER"

          # Temizlik: APK cache ve docs budama
          sudo chroot build-root/rootfs apk cache clean || true
          sudo rm -rf build-root/rootfs/var/cache/apk/* build-root/rootfs/usr/share/man build-root/rootfs/usr/share/doc

          sudo umount build-root/rootfs/proc build-root/rootfs/sys build-root/rootfs/dev

          # Kernel ve initramfs ISO boot dizinine taşı
          sudo cp build-root/rootfs/boot/vmlinuz-lts build-root/iso/boot/vmlinuz-lts
          sudo cp build-root/rootfs/boot/initramfs-lts build-root/iso/boot/initramfs-lts

          # tgh-install ekle (canlı ortama)
          sudo mkdir -p build-root/rootfs/usr/local/bin
          sudo cp -v tgh-install build-root/rootfs/usr/local/bin/tgh-install
          sudo chmod +x build-root/rootfs/usr/local/bin/tgh-install

          # Temiz bir target rootfs tarball üret (hedef diske açılacak altın kopya)
          sudo mkdir -p build-root/target-root
          sudo cp -a build-root/rootfs/* build-root/target-root/
          sudo rm -rf build-root/target-root/dev/* build-root/target-root/proc/* build-root/target-root/sys/* build-root/target-root/run/* build-root/target-root/tmp/*
          sudo mkdir -p build-root/target-root/dev build-root/target-root/proc build-root/target-root/sys build-root/target-root/run build-root/target-root/tmp build-root/target-root/mnt

          # Payload'ı ISO köküne koy
          sudo tar -czf build-root/iso/rootfs.tar.gz -C build-root/target-root .

          # Initramfs içine tgh-install ve payload erişimi/yardımcısı ekle
          sudo mkdir -p build-root/initrd-extract
          sudo bash -c 'cd build-root/initrd-extract && zcat ../iso/boot/initramfs-lts | cpio -idm --quiet'
          sudo mkdir -p build-root/initrd-extract/usr/local/bin build-root/initrd-extract/mnt/cdrom
          sudo cp -v tgh-install build-root/initrd-extract/usr/local/bin/tgh-install
          sudo cp -v build-root/iso/rootfs.tar.gz build-root/initrd-extract/rootfs.tar.gz
          sudo chmod +x build-root/initrd-extract/usr/local/bin/tgh-install
          sudo bash -c 'cd build-root/initrd-extract && find . | cpio -o -H newc --owner=0:0 2>/dev/null | gzip > ../iso/boot/initramfs-lts'

      - name: GRUB Konfigürasyonu ve ISO Paketi
        run: |
          set -e
          cat << 'EOF' > build-root/iso/boot/grub/grub.cfg
          set timeout=3
          set default=0
          menuentry "TAGCHAOS OS (Live / Install)" {
              linux /boot/vmlinuz-lts quiet
              initrd /boot/initramfs-lts
          }
          EOF

          mkdir -p dist
          grub-mkrescue -o dist/tagchaos-os.iso build-root/iso
          ls -lh dist/tagchaos-os.iso

      - name: Yapıtları Kaydet
        uses: actions/upload-artifact@v4
        with:
          name: tagchaos-os
          path: dist/tagchaos-os.iso
