name: TAGCHAOS OS Installer Build Pipeline

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-iso:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu Klonla
        uses: actions/checkout@v4

      - name: Sistem Paketlerini Kur
        run: |
          sudo apt-get update
          sudo apt-get install -y xorriso wget curl parted grub-pc-bin grub-common cpio gzip xz-utils mtools util-linux rsync binutils

      - name: ISO Derleme Betiğini Çalıştır
        run: |
          chmod +x build.sh
          ./build.sh

      - name: ISO Artifact Yükle
        uses: actions/upload-artifact@v4
        with:
          name: tagchaos-os-iso
          path: dist/tagchaos-os.iso
