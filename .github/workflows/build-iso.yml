name: TAGCHAOS OS Hyper-Minimal ISO

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodları Çek
        uses: actions/checkout@v4

      - name: Sistem Araçlarını Kur
        run: |
          sudo apt-get update
          sudo apt-get install -y xorriso wget curl parted grub-pc-bin grub-common cpio gzip mtools util-linux rsync

      - name: Minimal Rootfs ve Payload Hazırlığı
        run: |
          set -e
          mkdir -p work/rootfs work/iso/boot/grub work/dist work/clean-payload work/initrd-base
          
          ALPINE_VER="3.20.3"
          echo "[*] Alpine minirootfs indiriliyor..."
          wget -q "https://dl-cdn.alpinelinux.org/alpine/v3.20/releases/x86_64/alpine-minirootfs-${ALPINE_VER}-x86_64.tar.gz" -O alpine.tar.gz
          tar -xzf alpine.tar.gz -C work/rootfs
          rm alpine.tar.gz

          sudo cp /etc/resolv.conf work/rootfs/etc/resolv.conf
          sudo bash -c 'cat << 'EOF' > work/rootfs/etc/apk/repositories
          https://dl-cdn.alpinelinux.org/alpine/v3.20/main
          https://dl-cdn.alpinelinux.org/alpine/v3.20/community
          EOF'

          sudo mount --bind /proc work/rootfs/proc
          sudo mount --bind /sys work/rootfs/sys
          sudo mount --bind /dev work/rootfs/dev
          
          sudo chroot work/rootfs apk update
          # SADECE ŞART OLANLAR: 1270 MiB çöplük yok, saf çekirdek + araçlar (~150-200MB max)
          sudo chroot work/rootfs apk add --no-cache linux-lts busybox e2fsprogs util-linux grub grub-bios rsync

          # Sert temizlik: Cache, doc, man, locale sıfırlama
          sudo chroot work/rootfs rm -rf /var/cache/apk/* /usr/share/man /usr/share/doc /lib/apk/db/* || true

          sudo umount work/rootfs/proc work/rootfs/sys work/rootfs/dev

          # Kernel ISO boot dizinine taşı
          sudo cp work/rootfs/boot/vmlinuz-lts work/iso/boot/vmlinuz-lts

          # tgh-install ekle
          sudo mkdir -p work/rootfs/usr/local/bin
          sudo cp -v tgh-install work/rootfs/usr/local/bin/tgh-install
          sudo chmod +x work/rootfs/usr/local/bin/tgh-install

          # Temiz payload üret (rootfs.tar.gz) -> ISO köküne koy
          sudo rsync -a --exclude={'dev/*','proc/*','sys/*','run/*','tmp/*','mnt/*'} work/rootfs/ work/clean-payload/
          sudo mkdir -p work/clean-payload/dev work/clean-payload/proc work/clean-payload/sys work/clean-payload/run work/clean-payload/tmp work/clean-payload/mnt
          sudo tar -czf work/iso/rootfs.tar.gz -C work/clean-payload .

          # ULTRA-SLIM INITRAMFS
          sudo mkdir -p work/initrd-base/{bin,sbin,etc,proc,sys,dev,mnt,root,usr/local/bin}
          sudo cp -a work/rootfs/bin/busybox work/initrd-base/bin/
          sudo chroot work/initrd-base /bin/busybox --install -s || true
          sudo cp -v tgh-install work/initrd-base/usr/local/bin/tgh-install || true
          sudo chmod +x work/initrd-base/usr/local/bin/tgh-install || true
          sudo cp work/iso/rootfs.tar.gz work/initrd-base/rootfs.tar.gz || true

          # Özel hafif init betiği
          sudo tee work/initrd-base/init << 'EOF'
          #!/bin/sh
          mount -t proc none /proc
          mount -t sysfs none /sys
          mount -t devtmpfs none /dev 2>/dev/null || true
          mkdir -p /dev/pts
          mount -t devpts devpts /dev/pts 2>/dev/null || true
          export PATH=/usr/local/bin:/usr/bin:/bin:/sbin
          
          clear
          echo "=========================================="
          echo "    TAGCHAOS OS (Hyper-Lean) v1.0         "
          echo "    Kurulum için  : tgh-install           "
          echo "=========================================="
          exec /bin/sh
          EOF
          sudo chmod +x work/initrd-base/init

          # Initrd cpio paketleme
          sudo bash -c 'cd work/initrd-base && find . | cpio -o -H newc --owner=0:0 2>/dev/null | gzip > ../iso/boot/initrd.img'
          rm -f work/iso/boot/initramfs-lts || true
          ls -lh work/iso/boot/initrd.img work/iso/rootfs.tar.gz

      - name: GRUB Konfigürasyonu ve ISO Paketi
        run: |
          set -e
          cat << 'EOF' > work/iso/boot/grub/grub.cfg
          set timeout=3
          set default=0
          menuentry "TAGCHAOS OS (Live / Install)" {
              linux /boot/vmlinuz-lts quiet
              initrd /boot/initrd.img
          }
          EOF

          sudo chmod -R 755 work/iso
          sudo grub-mkrescue -o work/dist/tagchaos-os.iso work/iso
          sudo chown -R $USER:$USER work/dist/
          ls -lh work/dist/tagchaos-os.iso

      - name: Yapıtları Kaydet
        uses: actions/upload-artifact@v4
        with:
          name: tagchaos-os
          path: work/dist/tagchaos-os.iso
