name: TAGCHAOS OS Real-Hardware ISO Builder

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodları Çek
        uses: actions/checkout@v4

      - name: Sistem Araçlarını Kur
        run: |
          sudo apt-get update
          sudo apt-get install -y xorriso wget curl parted grub-pc-bin grub-common cpio gzip mtools

      - name: Rootfs ve LTS Kernel Hazırlığı
        run: |
          set -e
          sudo mkdir -p build-root/rootfs/boot build-root/iso/boot/grub dist
          
          ALPINE_VER="3.20.3"
          echo "[*] Alpine minirootfs indiriliyor..."
          wget -q "https://dl-cdn.alpinelinux.org/alpine/v3.20/releases/x86_64/alpine-minirootfs-${ALPINE_VER}-x86_64.tar.gz" -O alpine.tar.gz
          tar -xzf alpine.tar.gz -C build-root/rootfs
          rm alpine.tar.gz

          sudo cp /etc/resolv.conf build-root/rootfs/etc/resolv.conf
          cat << 'EOF' > build-root/rootfs/etc/apk/repositories
          https://dl-cdn.alpinelinux.org/alpine/v3.20/main
          https://dl-cdn.alpinelinux.org/alpine/v3.20/community
          EOF

          # Donanım sürücüleri, LTS kernel ve mkinitfs mühürle
          sudo mount --bind /proc build-root/rootfs/proc
          sudo mount --bind /sys build-root/rootfs/sys
          sudo mount --bind /dev build-root/rootfs/dev
          sudo chroot build-root/rootfs apk update
          sudo chroot build-root/rootfs apk add linux-lts mkinitfs util-linux e2fsprogs grub grub-bios

          # Kernel sürümünü bul ve initramfs üret
          LTS_VER=$(ls build-root/rootfs/lib/modules | tail -n 1)
          sudo chroot build-root/rootfs mkinitfs -o /boot/initramfs-lts "$LTS_VER"
          sudo umount build-root/rootfs/proc build-root/rootfs/sys build-root/rootfs/dev

          # Kernel ve initramfs ISO boot dizinine taşı
          sudo cp build-root/rootfs/boot/vmlinuz-lts build-root/iso/boot/vmlinuz-lts
          sudo cp build-root/rootfs/boot/initramfs-lts build-root/iso/boot/initramfs-lts

          # tgh-install ekle
          sudo mkdir -p build-root/rootfs/usr/local/bin
          sudo cp -v tgh-install build-root/rootfs/usr/local/bin/tgh-install
          sudo chmod +x build-root/rootfs/usr/local/bin/tgh-install

          # Temel init script
          cat << 'EOF' > build-root/rootfs/init
          #!/bin/sh
          sudo mount -t proc none /proc
          sudo mount -t sysfs none /sys
          sudo mount -t devtmpfs none /dev 2>/dev/null || true
          sudo mkdir -p /dev/pts
          sudo mount -t devpts devpts /dev/pts 2>/dev/null || true
          mdev -s 2>/dev/null || true
          export PATH=/usr/local/bin:/usr/bin:/bin:/sbin
          
          clear
          echo "=========================================="
          echo "    TAGCHAOS OS (LTS / Real-HW) v1.2      "
          echo "    Kurulum için  : tgh-install           "
          echo "=========================================="
          exec /bin/sh
          EOF
          chmod +x build-root/rootfs/init

          # Canlı ortam / Initramfs birleştirme veya kök entegrasyonu
          # Live/Install ISO kökünü oluşturmak için rootfs içeriğini ISO'ya veya initramfs'e aktar
          # Basitlik için tüm rootfs'i cpio.gz live initrd yapıyoruz:
          rm -f build-root/iso/boot/initramfs-lts
          cd build-root/rootfs
          find . | cpio -o -H newc 2>/dev/null | gzip > ../iso/boot/initrd.img
          cd ../..

      - name: GRUB Konfigürasyonu ve ISO Paketi
        run: |
          set -e
          cat << 'EOF' > build-root/iso/boot/grub/grub.cfg
          set timeout=3
          set default=0
          menuentry "TAGCHAOS OS (Live/Install)" {
              linux /boot/vmlinuz-lts quiet
              initrd /boot/initrd.img
          }
          EOF

          sudo mkdir -p dist
          grub-mkrescue -o dist/tagchaos-os-installable.iso build-root/iso

      - name: Yapıtları Kaydet
        uses: actions/upload-artifact@v4
        with:
          name: tagchaos-os-installable
          path: dist/tagchaos-os-installable.iso
