name: TAGCHAOS OS Installable ISO Builder

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodları Çek
        uses: actions/checkout@v4

      - name: Sistem Araçlarını Kur
        run: |
          sudo apt-get update
          sudo apt-get install -y xorriso wget curl parted grub-pc-bin grub-common cpio gzip mtools

      - name: Initramfs ve ISO Hazırlığı
        run: |
          set -e
          mkdir -p build-root/rootfs/boot build-root/iso/boot/grub dist
          
          ALPINE_VER="3.20.3"
          echo "[*] Alpine minirootfs indiriliyor..."
          wget -q "https://dl-cdn.alpinelinux.org/alpine/v3.20/releases/x86_64/alpine-minirootfs-${ALPINE_VER}-x86_64.tar.gz" -O alpine.tar.gz
          tar -xzf alpine.tar.gz -C build-root/rootfs
          rm alpine.tar.gz

          echo "[*] Kernel indiriliyor..."
          wget -q "https://dl-cdn.alpinelinux.org/alpine/v3.20/releases/x86_64/netboot/vmlinuz-virt" -O build-root/iso/boot/vmlinuz-virt

          cp /etc/resolv.conf build-root/rootfs/etc/resolv.conf
          cat << 'EOF' > build-root/rootfs/etc/apk/repositories
          https://dl-cdn.alpinelinux.org/alpine/v3.20/main
          https://dl-cdn.alpinelinux.org/alpine/v3.20/community
          EOF

          # Build aşamasında fdisk (util-linux) ve mkfs.ext4 (e2fsprogs) mühürle
          sudo mount --bind /proc build-root/rootfs/proc
          sudo mount --bind /sys build-root/rootfs/sys
          sudo mount --bind /dev build-root/rootfs/dev
          sudo chroot build-root/rootfs apk update
          sudo chroot build-root/rootfs apk add util-linux e2fsprogs
          sudo umount build-root/rootfs/proc build-root/rootfs/sys build-root/rootfs/dev

          # tgh-install ekle
          mkdir -p build-root/rootfs/usr/local/bin
          cp -v tgh-install build-root/rootfs/usr/local/bin/tgh-install
          chmod +x build-root/rootfs/usr/local/bin/tgh-install

          # Temel init script
          cat << 'EOF' > build-root/rootfs/init
          #!/bin/sh
          mount -t proc none /proc
          mount -t sysfs none /sys
          mount -t devtmpfs none /dev 2>/dev/null || true
          export PATH=/usr/local/bin:/usr/bin:/bin:/sbin
          
          clear
          echo "=========================================="
          echo "    TAGCHAOS OS (Alpine Native) v1.1      "
          echo "    Kurulum için  : tgh-install /dev/sdX  "
          echo "=========================================="
          exec /bin/sh
          EOF
          chmod +x build-root/rootfs/init

          echo "[*] CPIO.gz initramfs paketleniyor..."
          cd build-root/rootfs
          find . | cpio -o -H newc 2>/dev/null | gzip > ../iso/boot/initramfs.gz
          cd ../..

      - name: GRUB Konfigürasyonu ve ISO Paketi
        run: |
          set -e
          cat << 'EOF' > build-root/iso/boot/grub/grub.cfg
          set timeout=3
          set default=0
          menuentry "TAGCHAOS OS (Alpine Native)" {
              linux /boot/vmlinuz-virt quiet
              initrd /boot/initramfs.gz
          }
          EOF

          mkdir -p dist
          grub-mkrescue -o dist/tagchaos-os-installable.iso build-root/iso

      - name: Yapıtları Kaydet
        uses: actions/upload-artifact@v4
        with:
          name: tagchaos-os-installable
          path: dist/tagchaos-os-installable.iso
