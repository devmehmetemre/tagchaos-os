name: TAGCHAOS OS Installable ISO Builder

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodları Çek
        uses: actions/checkout@v4

      - name: Sistem Araçlarını Kur
        run: |
          sudo apt-get update
          sudo apt-get install -y xorriso squashfs-tools wget curl parted grub-pc-bin grub-common mtools

      - name: Temel ve Gerçek Kernel Entegrasyonu
        run: |
          set -e
          mkdir -p build-root/rootfs/boot build-root/iso/boot/grub dist
          
          ALPINE_VER="3.20.3"
          echo "[*] Alpine minirootfs indiriliyor..."
          wget -q "https://dl-cdn.alpinelinux.org/alpine/v3.20/releases/x86_64/alpine-minirootfs-${ALPINE_VER}-x86_64.tar.gz" -O alpine.tar.gz
          tar -xzf alpine.tar.gz -C build-root/rootfs
          rm alpine.tar.gz

          echo "[*] Kernel indiriliyor..."
          wget -q "https://dl-cdn.alpinelinux.org/alpine/v3.20/releases/x86_64/netboot/vmlinuz-virt" -O build-root/rootfs/boot/vmlinuz-virt
          wget -q "https://dl-cdn.alpinelinux.org/alpine/v3.20/releases/x86_64/netboot/initramfs-virt" -O build-root/rootfs/boot/initramfs-virt

          cp /etc/resolv.conf build-root/rootfs/etc/resolv.conf

          # Saf shell araçlarını rootfs içine entegre et
          mkdir -p build-root/rootfs/usr/local/bin
          cp tghpm build-root/rootfs/usr/local/bin/tghpm
          chmod +x build-root/rootfs/usr/local/bin/tghpm
          
          cp tgh-install build-root/rootfs/usr/local/bin/tgh-install
          chmod +x build-root/rootfs/usr/local/bin/tgh-install

          mkdir -p build-root/rootfs/root/.tgh/apps build-root/rootfs/root/.tgh/cache

          cat << 'EOF' > build-root/rootfs/init
          #!/bin/sh
          mount -t proc none /proc
          mount -t sysfs none /sys
          export PATH=/usr/local/bin:/usr/bin:/bin:/sbin
          clear
          echo "=========================================="
          echo "    TAGCHAOS OS (Shell-Native) v0.4       "
          echo "    Kurulum için: tgh-install /dev/sdX    "
          echo "=========================================="
          tghpm demo
          exec /bin/sh
          EOF
          chmod +x build-root/rootfs/init

          echo "[*] Rootfs squashfs sıkıştırılıyor..."
          mksquashfs build-root/rootfs build-root/iso/rootfs.sfs -comp xz -no-progress
          
          cp build-root/rootfs/boot/vmlinuz-virt build-root/iso/boot/
          cp build-root/rootfs/boot/initramfs-virt build-root/iso/boot/

      - name: GRUB Konfigürasyonu ve ISO Paketi
        run: |
          set -e
          mkdir -p build-root/iso/boot/grub
          cat << 'EOF' > build-root/iso/boot/grub/grub.cfg
          set timeout=3
          set default=0
          menuentry "TAGCHAOS OS (Live/Installer)" {
              linux /boot/vmlinuz-virt ip=dhcp quiet
              initrd /boot/initramfs-virt
          }
          EOF

          mkdir -p dist
          grub-mkrescue -o dist/tagchaos-os-installable.iso build-root/iso

      - name: Yapıtları Kaydet
        uses: actions/upload-artifact@v4
        with:
          name: tagchaos-os-installable
          path: dist/tagchaos-os-installable.iso
