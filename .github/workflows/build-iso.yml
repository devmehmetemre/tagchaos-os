name: TAGCHAOS OS Live ISO Builder

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodları Çek
        uses: actions/checkout@v4

      - name: Sistem Araçlarını Kur
        run: |
          sudo apt-get update
          sudo apt-get install -y xorriso squashfs-tools wget curl

      - name: Alpine Rootfs & tghpm Entegrasyonu
        run: |
          mkdir -p build-root/rootfs build-root/iso/boot/grub dist
          
          # Alpine Minirootfs indir ve aç
          ALPINE_VER="3.20.3"
          wget "https://dl-cdn.alpinelinux.org/alpine/v3.20/releases/x86_64/alpine-minirootfs-${ALPINE_VER}-x86_64.tar.gz" -O alpine.tar.gz
          tar -xzf alpine.tar.gz -C build-root/rootfs
          rm alpine.tar.gz

          # DNS çözünürlüğü için resolv.conf kopyala
          cp /etc/resolv.conf build-root/rootfs/etc/resolv.conf

          # tghpm CLI'yı rootfs içine at
          mkdir -p build-root/rootfs/usr/local/bin
          cp tghpm.py build-root/rootfs/usr/local/bin/tghpm
          chmod +x build-root/rootfs/usr/local/bin/tghpm

          # Özel tghpm dizinleri
          mkdir -p build-root/rootfs/root/.tgh/apps build-root/rootfs/root/.tgh/cache

          # Özel Giriş (Init) Scripti
          cat << 'EOF' > build-root/rootfs/init
          #!/bin/sh
          mount -t proc none /proc
          mount -t sysfs none /sys
          echo "=========================================="
          echo "    TAGCHAOS OS (Alpine Base) v0.2        "
          echo "=========================================="
          tghpm demo
          exec /bin/sh
          EOF
          chmod +x build-root/rootfs/init

          # Rootfs Squashfs sıkıştır
          mksquashfs build-root/rootfs build-root/iso/rootfs.sfs -comp xz

      - name: GRUB Konfigürasyonu
        run: |
          cat << 'EOF' > build-root/iso/boot/grub/grub.cfg
          set timeout=3
          set default=0
          menuentry "TAGCHAOS OS (Alpine Live)" {
              linux /boot/vmlinuz-zen initrd=/boot/initramfs-zen init=/init
          }
          EOF

      - name: Yapıtları Kaydet
        uses: actions/upload-artifact@v4
        with:
          name: tagchaos-alpine-rootfs
          path: build-root/iso/rootfs.sfs
