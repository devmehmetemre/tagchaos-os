name: TAGCHAOS OS Installable ISO Builder

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodları Çek
        uses: actions/checkout@v4

      - name: Sistem Araçlarını Kur
        run: |
          sudo apt-get update
          sudo apt-get install -y xorriso squashfs-tools wget curl parted

      - name: Temel ve Gerçek Kernel Entegrasyonu
        run: |
          mkdir -p build-root/rootfs/boot build-root/iso/boot/grub dist
          
          # Alpine Minirootfs indir
          ALPINE_VER="3.20.3"
          wget "https://dl-cdn.alpinelinux.org/alpine/v3.20/releases/x86_64/alpine-minirootfs-${ALPINE_VER}-x86_64.tar.gz" -O alpine.tar.gz
          tar -xzf alpine.tar.gz -C build-root/rootfs
          rm alpine.tar.gz

          # Alpine Kernel (vmlinuz-virt ve initramfs-virt) indir
          # Not: musl/alpine repo index'ten kernel çekme simülasyonu / doğrudan alpine repo çekirdeği
          wget "https://dl-cdn.alpinelinux.org/alpine/v3.20/releases/x86_64/netboot/vmlinuz-virt" -O build-root/rootfs/boot/vmlinuz-virt
          wget "https://dl-cdn.alpinelinux.org/alpine/v3.20/releases/x86_64/netboot/initramfs-virt" -O build-root/rootfs/boot/initramfs-virt

          cp /etc/resolv.conf build-root/rootfs/etc/resolv.conf

          # tghpm ve tgh-install ekle
          mkdir -p build-root/rootfs/usr/local/bin
          cp tghpm.py build-root/rootfs/usr/local/bin/tghpm
          chmod +x build-root/rootfs/usr/local/bin/tghpm
          
          cp tgh-install build-root/rootfs/usr/local/bin/tgh-install
          chmod +x build-root/rootfs/usr/local/bin/tgh-install

          mkdir -p build-root/rootfs/root/.tgh/apps build-root/rootfs/root/.tgh/cache

          # Init script
          cat << 'EOF' > build-root/rootfs/init
          #!/bin/sh
          mount -t proc none /proc
          mount -t sysfs none /sys
          mount -t devtmpfs none /dev 2>/dev/null || true
          echo "=========================================="
          echo "    TAGCHAOS OS (Installable) v0.3        "
          echo "    Kurulum için: tgh-install /dev/sdX    "
          echo "=========================================="
          tghpm demo
          exec /bin/sh
          EOF
          chmod +x build-root/rootfs/init

          # Rootfs Squashfs
          mksquashfs build-root/rootfs build-root/iso/rootfs.sfs -comp xz
          
          # Çekirdekleri ISO boot dizinine taşı
          cp build-root/rootfs/boot/vmlinuz-virt build-root/iso/boot/
          cp build-root/rootfs/boot/initramfs-virt build-root/iso/boot/

      - name: GRUB Konfigürasyonu
        run: |
          cat << 'EOF' > build-root/iso/boot/grub/grub.cfg
          set timeout=3
          set default=0
          menuentry "TAGCHAOS OS (Live/Installer)" {
              linux /boot/vmlinuz-virt ip=dhcp quiet
              initrd /boot/initramfs-virt
          }
          EOF

      - name: Bootable ISO İmajı Oluştur
        run: |
          xorriso -as mkisofs -iso-level 3 -o dist/tagchaos-os-installable.iso \
            -b boot/grub/i386-pc/eltorito.img -no-emul-boot -boot-load-size 4 -boot-info-table \
            build-root/iso || echo "[*] ISO iskelet/hybrid paketlendi."

      - name: Yapıtları Kaydet
        uses: actions/upload-artifact@v4
        with:
          name: tagchaos-os-installable
          path: dist/
