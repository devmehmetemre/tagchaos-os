name: build-chaos

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    strategy:
      matrix:
        arch: [x86_64, aarch64]
        desktop: [xfce, lxqt, sway]
    steps:
      - uses: actions/checkout@v4
      - name: Show revision (hangi kod koşuyor?)
        run: |
          git rev-parse --short HEAD || true
          echo "--- artifact path:"; grep -n "path:" .github/workflows/build.yml
          echo "--- chmod:"; grep -n "chmod -R" .github/workflows/build.yml || echo YOK
          echo "--- grub-bios:"; grep -n "grub-bios" tools/make-iso.sh || echo YOK
          echo "--- keys preseed:"; grep -n "apk/keys" tools/make-iso.sh || echo YOK
          echo "--- eltorito dd:"; grep -n "EL TORITO" tools/make-iso.sh || echo YOK
      - name: Build rootfs (host, apk gerekmez)
        run: |
          sudo apt-get update && sudo apt-get install -y wget
          chmod +x build.sh profiles/live-overlay/gen-apkovl.sh kernel/build-kernel.sh profiles/desktop/xfce/chaos-xfce-defaults.sh cha-setup/cha-setup cha-setup/cha-setup-install branding/icons/install.sh
          sh kernel/build-kernel.sh --arch ${{ matrix.arch }}
          ./build.sh --arch ${{ matrix.arch }} --desktop ${{ matrix.desktop }} --version ${GITHUB_REF_NAME:-dev}
      - name: Build ISO (Alpine Docker, apk burada)
        run: |
          docker run --rm -v "${{ github.workspace }}:/work" -w /work alpine:3.22 sh -c "chmod +x tools/make-iso.sh profiles/live-overlay/gen-apkovl.sh && sh tools/make-iso.sh --arch ${{ matrix.arch }} --desktop ${{ matrix.desktop }} --version ${GITHUB_REF_NAME:-dev} && chmod -R a+rX /work/out"
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: chaos-${{ matrix.arch }}-${{ matrix.desktop }}
          path: out/*.iso
